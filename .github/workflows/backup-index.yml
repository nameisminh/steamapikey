# Mỗi lần bạn push code trang web lên nhánh main (index.html, assets/, sw.js...), BẢN CŨ của cả trang (commit trước)
# được nén thành 1 file .zip rồi chép sang nhánh "backup", trong thư mục backup/, đặt tên theo giờ Việt Nam.
# Ví dụ: backup/site_2026-10-24_21-05-33_a1b2c3d.zip  (giải nén ra là chạy được, đủ index.html + assets/css/js)
# Trước đây chỉ lưu mỗi index.html nên từ khi CSS/JS tách ra assets/ các bản backup mở lên bị lỗi (thiếu style và script).
# Ảnh, nhạc, video KHÔNG nằm trong zip cho nhẹ: lấy lại từ lịch sử git nếu cần.
# Nhánh backup tách riêng nên trang web (deploy từ main) không bị đổi và không bị lộ thêm file.
# Đặt file này ở: .github/workflows/backup-index.yml

name: Backup trang web cũ

on:
  push:
    branches: [main]
    paths: [index.html, 'assets/**', sw.js, 404.html, reset.html, manifest.webmanifest, _headers]

permissions:
  contents: write

concurrency:
  group: backup-index
  cancel-in-progress: false

env:
  KEEP: 30                    # giữ tối đa bao nhiêu bản zip (bản cũ nhất bị xoá khỏi nhánh backup)

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Đóng gói bản cũ (trước lần push này)
        id: old
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE:index.html" 2>/dev/null; then
            echo "Không có bản cũ để backup (lần push đầu hoặc file mới)."
            echo "has=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=""
          for f in index.html assets sw.js 404.html reset.html manifest.webmanifest _headers robots.txt; do
            git cat-file -e "$BEFORE:$f" 2>/dev/null && FILES="$FILES $f"
          done
          mkdir -p /tmp/old
          git archive --format=zip -9 -o /tmp/old/site.zip "$BEFORE" -- $FILES
          echo "has=true" >> "$GITHUB_OUTPUT"

      - name: Đẩy bản cũ sang nhánh backup
        if: steps.old.outputs.has == 'true'
        run: |
          STAMP=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d_%H-%M-%S)
          SHORT=$(echo "${{ github.event.before }}" | cut -c1-7)
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin backup >/dev/null 2>&1; then
            git fetch origin backup
            git checkout -B backup origin/backup
          else
            git checkout --orphan backup
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p backup
          cp /tmp/old/site.zip "backup/site_${STAMP}_${SHORT}.zip"
          ls -1 backup/site_*.zip | sort -r | tail -n +$((KEEP + 1)) | xargs -r rm --
          git add backup
          git commit -m "Backup trang cũ (trước commit ${GITHUB_SHA::7})"
          git push origin backup
