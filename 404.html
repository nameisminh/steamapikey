<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Không tìm thấy · Ming</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='white'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='black' font-family='sans-serif' font-weight='700'>M</text></svg>">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--bg:#000;--text:#f5f5f5;--muted:#8f8f8f;--line:#232323;--line-hi:#4a4a4a;--white:#fff;color-scheme:dark;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{color-scheme:light;--bg:#fafafa;--text:#0a0a0a;--muted:#6a6a6a;--line:#e3e3e3;--line-hi:#b9b9b9;--white:#0a0a0a}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.7 var(--body);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:1.5rem}
main{max-width:34rem;width:100%}
.tag{display:inline-block;padding:.15rem .7rem;border:1px solid var(--line-hi);border-radius:999px;color:var(--muted);font:400 .78rem var(--mono)}
h1{margin:1rem 0 .6rem;font:800 clamp(4.5rem,22vw,8rem)/1 var(--body);letter-spacing:-.04em}
p{margin:0 0 1.5rem;color:var(--muted)}
code{display:block;margin:0 0 1.8rem;padding:.7rem 1rem;border:1px solid var(--line);border-radius:.8rem;font:400 .85rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
a.btn{display:inline-flex;align-items:center;padding:.6rem 1.2rem;border-radius:.7rem;background:var(--white);color:var(--bg);font-weight:600;text-decoration:none;border:1px solid var(--white)}
a.btn:hover{opacity:.85}
a.btn:focus-visible{outline:2px solid var(--white);outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="tag">ming@home ~ $ cd ???</span>
  <h1>404</h1>
  <p>Trang này không có ở đây. Có thể link bị gõ sai, hoặc mình đã dời nó đi chỗ khác.</p>
  <code id="path"></code>
  <a class="btn" href="/">Về trang chủ của Ming</a>
</main>
<script>document.getElementById('path').textContent=location.pathname</script>
</body>
</html>
