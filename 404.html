<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>404 · Ming</title>
<!-- TRANG 404 KIỂU TERMINAL: dùng chung giao diện sáng/tối và ngôn ngữ mà người xem đã chọn ở trang chính (đọc từ localStorage). Không tải gì từ ngoài. -->
<script>try{var _t=localStorage.getItem('theme');if(_t!=='light'&&_t!=='dark')_t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',_t);if(localStorage.getItem('lang')==='en')document.documentElement.lang='en'}catch(e){}</script>
<style>
:root{--bg:#000;--card:#0b0b0d;--line:#222226;--line-hi:#34343a;--text:#ededed;--muted:#8a8a91;--acc:#8bf0a8;--err:#ff7b72;--h:#e6b450;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
:root[data-theme="light"]{--bg:#fafafa;--card:#fff;--line:#e4e4e7;--line-hi:#d4d4d8;--text:#111113;--muted:#6b6b73;--acc:#15803d;--err:#c2410c;--h:#a16207;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{min-height:100dvh;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));font:400 15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.win{width:min(40rem,100%);border:1px solid var(--line);border-radius:1rem;background:var(--card);overflow:hidden;box-shadow:0 30px 70px -30px rgba(0,0,0,.6)}
.head{display:flex;align-items:center;gap:.4rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);font:400 .75rem var(--mono);color:var(--muted)}
.head i{width:.6rem;height:.6rem;border-radius:50%;background:var(--line-hi)}
.head span{margin-left:.5rem}
pre{margin:0;padding:1.1rem 1.1rem 1.2rem;font:400 .88rem/1.85 var(--mono);white-space:pre-wrap;word-break:break-word}
.p{color:var(--acc)}.e{color:var(--err)}.m{color:var(--muted)}.n{color:var(--h)}
.big{display:block;margin:.2rem 0 .6rem;font:700 clamp(3rem,14vw,5.5rem)/1 var(--mono);letter-spacing:-.04em;color:var(--text)}
a{color:var(--acc);text-underline-offset:3px}
.caret{display:inline-block;width:.55rem;height:1.05em;vertical-align:-.18em;background:var(--acc);animation:b 1.1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}
.act{display:flex;flex-wrap:wrap;gap:.6rem;padding:0 1.1rem 1.2rem}
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem 1.1rem;border:1px solid var(--line-hi);border-radius:999px;color:var(--text);text-decoration:none;font:600 .9rem system-ui,sans-serif}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
</style>
</head>
<body>
<main class="win" aria-labelledby="t">
  <div class="head" aria-hidden="true"><i></i><i></i><i></i><span>ming@home ~</span></div>
  <pre id="out"><span class="big" id="t">404</span><span class="p">$</span> cd <span id="path"></span>
<span class="e" data-vi="bash: cd: không có trang này" data-en="bash: cd: no such page">bash: cd: không có trang này</span>
<span class="m" data-vi="# Có thể link đã cũ hoặc gõ nhầm địa chỉ." data-en="# The link may be old, or the address was mistyped.">// Có thể link đã cũ hoặc gõ nhầm địa chỉ.</span>

<span class="p">$</span> ls ~
<a href="/#g-about" data-vi="về-ming/" data-en="about/">về-ming/</a>  <a href="/#g-likes" data-vi="sở-thích/" data-en="likes/">sở-thích/</a>  <a href="/#g-play" data-vi="chơi-và-xem/" data-en="play/">chơi-và-xem/</a>  <a href="/#g-log" data-vi="nhật-ký/" data-en="log/">nhật-ký/</a>  <a href="/#contact" data-vi="liên-hệ/" data-en="contact/">liên-hệ/</a>

<span class="p">$</span> cd ~ <span class="caret" aria-hidden="true"></span></pre>
  <div class="act">
    <a class="btn pri" href="/" data-vi="← Về trang chủ" data-en="← Back home">← Về trang chủ</a>
    <a class="btn" href="javascript:history.back()" data-vi="Quay lại" data-en="Go back">Quay lại</a>
  </div>
</main>
<script>
(function(){
  var en=document.documentElement.lang==='en';
  var p=location.pathname||'/';try{p=decodeURI(p)}catch(e){}
  document.getElementById('path').textContent=p;
  document.querySelectorAll('[data-vi]').forEach(function(e){e.textContent=e.getAttribute(en?'data-en':'data-vi')});
  /* Enter hoặc H: về trang chủ */
  document.addEventListener('keydown',function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;var k=(e.key||'').toLowerCase();if(k==='enter'&&document.activeElement===document.body||k==='h')location.href='/'});
})();
</script>
</body>
</html>
