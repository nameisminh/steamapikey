<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Làm mới · Ming</title>
<!-- TRANG LÀM MỚI (/reset): máy nào kẹt ở bản cũ thì mở trang này một lần.
     Xoá service worker và bộ nhớ đệm (cache) của trang trên máy đó, rồi tự về trang chủ bản mới nhất.
     GIỮ NGUYÊN localStorage: giao diện sáng/tối, ngôn ngữ, điểm cao Góc chơi... không bị mất.
     Máy chủ còn gửi kèm header Clear-Site-Data: "cache" cho trang này (xem _headers) để trình duyệt xoá luôn cache HTTP. -->
<script>try{var _t=localStorage.getItem('theme');if(_t!=='light'&&_t!=='dark')_t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',_t);if(localStorage.getItem('lang')==='en')document.documentElement.lang='en'}catch(e){}</script>
<style>
:root{--bg:#000;--card:#0b0b0d;--line:#222226;--text:#ededed;--muted:#8a8a91;--acc:#8bf0a8;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
:root[data-theme="light"]{--bg:#fafafa;--card:#fff;--line:#e4e4e7;--text:#111113;--muted:#6b6b73;--acc:#17803f;color-scheme:light}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{min-height:100dvh;display:grid;place-items:center;padding:16px;font:400 15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.box{width:min(26rem,100%);padding:1.4rem 1.3rem;border:1px solid var(--line);border-radius:1rem;background:var(--card);font:400 .85rem/1.9 var(--mono)}
.ok{color:var(--acc)}.mu{color:var(--muted)}
a{color:var(--acc)}
</style>
</head>
<body>
<div class="box" role="status" aria-live="polite" id="log"><div class="mu">$ reset</div></div>
<script>
(async function(){
  var en=document.documentElement.lang==='en',log=document.getElementById('log');
  function line(vi,e,cls){var d=document.createElement('div');if(cls)d.className=cls;d.textContent=en?e:vi;log.appendChild(d)}
  try{
    if('serviceWorker' in navigator){
      var regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function(r){return r.unregister()}));
      line('✓ gỡ service worker cũ ('+regs.length+')','✓ removed old service worker ('+regs.length+')','ok');
    }
    if(window.caches){
      var keys=await caches.keys();
      await Promise.all(keys.map(function(k){return caches.delete(k)}));
      line('✓ xoá bộ nhớ đệm ('+keys.length+')','✓ cleared cache ('+keys.length+')','ok');
    }
    line('✓ giữ nguyên cài đặt và điểm cao của bạn','✓ kept your settings and high scores','ok');
  }catch(e){line('! không xoá được hết, vẫn thử tải bản mới','! could not clear everything, loading the new version anyway')}
  line('→ đang mở trang chủ bản mới…','→ opening the latest home page…','mu');
  setTimeout(function(){location.replace('/?v='+Date.now())},900);
})();
</script>
<noscript><p><a href="/">Về trang chủ</a></p></noscript>
</body>
</html>
